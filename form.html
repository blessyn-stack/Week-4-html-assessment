<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0"
        <title>Altschool Application Form</title>
    </head>
        <body>
            <header>
                <nav>
                    <a href="index.html">Home</a>
                    <a href="form.html">Application Form</a>
                </nav>
            </header>
            <main>
                <h1>Altschool Application Form</h1>
                <p>Fill in your details below to apply for altschool Africa.</p>
                <p>Don't have an account?
                    <a href="#">Sign Up</a>
                </p>
                <form>
                    <label for="email">Email</label>
                    <input
                    type="email"
                    id="email"
                    name="email"

                placeholder="john.doe@example.com"
                required
                >
                
                <br><br>
                <label for="password">Password</label>
                <input
                type="password"
                id="password"
                name="password"
                placeholder="********"
                required
                >
                <br><br>
                <button type="submit">Proceed to Dashboard</button>
                
                <br><br>
                <p>Forgot your password?
                    <a href="#">Reset Now</a>
                </p>
                <p>OR</p>
                <button type="button">Continue with Google</button>
                </form>
            </main>
            <footer>
                <address>
                    Altschool Africa
                    <br>
                    Lagos, Nigeria.
                </address>
                <p>&copy;2026 Altschool Africa. All rights reserved.</p>
            </footer>

        </body>
</html>
